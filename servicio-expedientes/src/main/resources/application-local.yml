server:
  port: 8081

spring:
  application:
    name: servicio-expedientes
  datasource:
    url: jdbc:h2:mem:muni_licencias_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console

tupa:
  tasas:
    bajo: 154.50
    medio: 218.00
    alto: 345.20
    muy-alto: 480.00
