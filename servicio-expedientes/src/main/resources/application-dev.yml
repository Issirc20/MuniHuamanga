# Perfil de desarrollo local sin dependencias externas (H2 en memoria con emulación PostgreSQL)
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:muni_licencias_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console

munihuamanga:
  firma-digital:
    enabled: true
    proveedor: RENIEC_REFIRMA_DEMO
    modo-dev-simulado: true
