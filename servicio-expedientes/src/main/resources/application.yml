server:
  port: 8081

spring:
  application:
    name: servicio-expedientes
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/muni_licencias_db}
    username: ${SPRING_DATASOURCE_USERNAME:muni_user}
    password: ${SPRING_DATASOURCE_PASSWORD:muni_pass123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:notificaciones@munihuamanga.gob.pe}
    password: ${MAIL_PASSWORD:}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    test-connection: false   # No falla el arranque si SMTP no está configurado

# Configuración de Tasas TUPA según Ley N° 28976 (RNF-17: configurable sin redeploy)
tupa:
  tasas:
    bajo: 154.50
    medio: 218.00
    alto: 345.20
    muy-alto: 480.00

# URLs de microservicios e integraciones
integraciones:
  servicio-formularios:
    url: ${URL_SERVICIO_FORMULARIOS:http://localhost:8082}
  servicio-verificacion:
    url: ${URL_SERVICIO_VERIFICACION:http://localhost:8083}
  adaptador-integracion:
    url: ${URL_ADAPTADOR_INTEGRACION:http://localhost:8084}

# Observabilidad (RNF-21)
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: false

# Documentación OpenAPI / Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

# Configuración del Remitente Institucional
notificacion:
  email:
    enabled: ${MAIL_ENABLED:false}         # Deshabilitado por defecto; activar en producción
    remitente: ${MAIL_USERNAME:notificaciones@munihuamanga.gob.pe}
    nombre-remitente: "Municipalidad Provincial de Huamanga"
    portal-ciudadano: ${PORTAL_URL:http://localhost:8081}
    portal-verificacion: ${PORTAL_VERIFICACION_URL:http://localhost:8081/verificar-licencia.html?codigo=}

# URL pública de verificación (compatible con DocumentoPdfService)
portal:
  verificacion:
    url: ${PORTAL_VERIFICACION_URL:http://localhost:8081/verificar-licencia.html?codigo=}

# ──────────────────────────────────────────────────────────────────────────────
# Fase 04 Sprint 4-C — Autenticación JWT y Spring Security 6
# ──────────────────────────────────────────────────────────────────────────────
jwt:
  secret: ${JWT_SECRET:MunicipalidadProvincialDeHuamangaGestionLicenciasSecretKeySegura2026!}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 horas (en milisegundos)
